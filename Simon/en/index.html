<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Panasonic Toughbook 33 — the most rugged enterprise laptop in the world. Waterproof, shockproof, and ready for extreme conditions." />
  <title>Toughbook 33 – Enterprise Rugged Laptop</title>
  <link rel="canonical" href="/Simon/en/index.html" />
  <link rel="alternate" href="/Simon/index.html" hreflang="nl" />
  <link rel="alternate" href="/Simon/en/index.html" hreflang="en" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='80' x='10' fill='white' font-weight='900'>P</text></svg>" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>

  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

  <div id="loading" role="status" aria-live="polite">
    <div class="loader"></div>
    <p>Loading website...</p>
  </div>

  <nav id="navbar" aria-label="Main navigation" style="display:none;"></nav>

  <main>
    <section id="hero" class="hero" aria-label="Hero" style="display:none;"></section>
    <section id="features" class="features" aria-label="Features" style="display:none;"></section>
    <section id="specifications" class="specs" aria-label="Specifications" style="display:none;"></section>
    <section id="gallery-section" class="gallery" aria-label="Product gallery" style="display:none;">
      <div class="section-inner">
        <div class="section-head fade-up">
          <h2 class="section-title">Product <span class="gradient-text">Gallery</span></h2>
          <p class="section-desc">Explore the Toughbook 33 from every angle with high-resolution detail.</p>
        </div>

        <div class="gallery-main fade-up">
          <div class="gallery-img-wrap">
            <img id="galleryMainImg" src="" alt="Toughbook Gallery" loading="lazy" />
            <div class="gallery-overlay">
              <div class="gallery-title" id="galleryTitle"></div>
              <div class="gallery-desc" id="galleryDesc"></div>
            </div>
            <button class="gallery-btn gallery-prev" id="galleryPrev" aria-label="Previous image">
              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <button class="gallery-btn gallery-next" id="galleryNext" aria-label="Next image">
              <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <div class="gallery-dots" role="tablist" aria-label="Gallery navigation">
              <button class="gallery-dot active" data-slide="0" role="tab" aria-selected="true" aria-label="Image 1"></button>
              <button class="gallery-dot" data-slide="1" role="tab" aria-selected="false" aria-label="Image 2"></button>
              <button class="gallery-dot" data-slide="2" role="tab" aria-selected="false" aria-label="Image 3"></button>
              <button class="gallery-dot" data-slide="3" role="tab" aria-selected="false" aria-label="Image 4"></button>
            </div>
          </div>
        </div>

        <div class="gallery-thumbs fade-up" role="tablist" aria-label="Gallery thumbnails">
          <button class="gallery-thumb active" data-slide="0" role="tab" aria-selected="true" aria-label="Cinematic View">
            <img src="../assets/images/Product gallery/Rugged_Panasonic_Toughbook_in_cinematic_lighting.png" alt="Cinematic View" loading="lazy" />
            <div class="gallery-thumb-overlay" aria-hidden="true"></div>
          </button>
          <button class="gallery-thumb" data-slide="1" role="tab" aria-selected="false" aria-label="Stormy Terrain">
            <img src="../assets/images/Product gallery/Rugged_Toughbook_in_stormy_terrain.png" alt="Stormy Terrain" loading="lazy" />
            <div class="gallery-thumb-overlay" aria-hidden="true"></div>
          </button>
          <button class="gallery-thumb" data-slide="2" role="tab" aria-selected="false" aria-label="Arctic Conditions">
            <img src="../assets/images/Product gallery/Rugged_Toughbook_in_a_snowy_wilderness.png" alt="Arctic Conditions" loading="lazy" />
            <div class="gallery-thumb-overlay" aria-hidden="true"></div>
          </button>
          <button class="gallery-thumb" data-slide="3" role="tab" aria-selected="false" aria-label="Studio Detail">
            <img src="../assets/images/Product gallery/Robuuste_Panasonic_Toughbook_in_mistige_studiohoek.png" alt="Studio Detail" loading="lazy" />
            <div class="gallery-thumb-overlay" aria-hidden="true"></div>
          </button>
        </div>
      </div>
    </section>

    <section id="downloads" class="downloads" aria-label="Downloads" style="display:none;"></section>
    <section id="cta" class="cta" aria-label="Call to action" style="display:none;"></section>
  </main>

  <footer id="footer" aria-label="Footer" style="display:none;"></footer>

  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
    </svg>
  </button>

  <script src="../assets/main-en.js"></script>
</body>
</html>
